<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="接客えいご">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161C" media="(prefers-color-scheme: dark)">
<title>ベビー接客えいご</title>
<!-- ホーム画面に追加したときのアイコン(元の絵は icons/icon.svg。tools/make-icons.sh でPNGを作る) -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<!-- 見た目は「ハングルの卵」の個別登録画面にそろえている(立体ボタン・ピンクの個別登録色)。アクセントだけベビー用品向けの緑みの青にした -->
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --text:#33302C;
    --sub:#746E65;
    --accent:#24877D;
    --accent-shade:#1A655E;
    --accent-light:#E5F4F1;
    --accent-border:#BFE3DC;
    --hair:#ECE7E0;
    --track:#F1ECE5;
    --blue:#2F5FD1;
    --blue-shade:#1F4DB8;
    --indiv:#B23368;
    --indiv-shade:#8A2350;
    --indiv-light:#FBEAF1;
    --pos-text:#1A655E;
    --gold:#C8860D;
    --gold-light:#FBF1DE;
    --blue-light:#EAF0FE;
    --danger:#C9352F;
    --on-accent:#FFFFFF;
    --overlay:rgba(20,22,28,0.6);
    --font-ui:'M PLUS Rounded 1c', "Hiragino Maru Gothic ProN", -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
    --font-en:-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161C; --surface:#242732; --text:#ECEDF1; --sub:#A6A9B8;
      --accent:#5CC4B6; --accent-shade:#3A9387; --accent-light:#173230; --accent-border:#27504B;
      --hair:#2B2E38; --track:#2B2E38; --blue:#6C8FEF; --blue-shade:#3F63C4;
      --indiv:#F291B7; --indiv-shade:#B8577D; --indiv-light:#3A2430;
      --pos-text:#5CC4B6; --gold:#E8B84B; --danger:#FF6E6E; --on-accent:#08201D;
      --gold-light:#3A311C; --blue-light:#202A44;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161C; --surface:#242732; --text:#ECEDF1; --sub:#A6A9B8;
    --accent:#5CC4B6; --accent-shade:#3A9387; --accent-light:#173230; --accent-border:#27504B;
    --hair:#2B2E38; --track:#2B2E38; --blue:#6C8FEF; --blue-shade:#3F63C4;
    --indiv:#F291B7; --indiv-shade:#B8577D; --indiv-light:#3A2430;
    --pos-text:#5CC4B6; --gold:#E8B84B; --danger:#FF6E6E; --on-accent:#08201D;
    --gold-light:#3A311C; --blue-light:#202A44;
  }
  *{ box-sizing:border-box; }
  html, body{ margin:0; padding:0; }
  html{ background:var(--bg); -webkit-text-size-adjust:100%; }
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--font-ui); font-weight:500; font-size:17px; line-height:1.6;
    -webkit-font-smoothing:antialiased; touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    /* 長押しで文字やアイコンが選択されたり、メニューが出たりしないようにする(ボタンを長押ししたときに邪魔になるため)。
       コピーできるのは、一覧の英単語・例文と入力欄だけ(辞書で調べたい人向け) */
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  body.sheet-open{ overflow:hidden; }
  input, textarea, .item-en [lang="en"], .item-ex-en{ -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }
  img, svg{ -webkit-user-drag:none; }
  button svg, button img{ pointer-events:none; }
  button{ font-family:inherit; color:inherit; }
  .app{ max-width:720px; margin:0 auto; padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  h1{ font-size:21px; font-weight:800; margin:0 0 4px; }
  p.sub, .sub{ color:var(--sub); font-size:15px; margin:0; }

  /* ----- ボタン(立体) ----- */
  .btn{
    display:block; width:100%; text-align:center; padding:14px 16px; border-radius:16px;
    border:none; border-bottom:5px solid var(--accent-shade); font-size:17px; font-weight:800; cursor:pointer; margin-top:12px;
    background:var(--accent); color:var(--on-accent); transition:transform .08s ease-out;
  }
  .btn:active{ transform:translateY(3px); border-bottom-width:2px; }
  .btn:disabled{ opacity:.45; transform:none; border-bottom-width:5px; cursor:not-allowed; }
  .btn.btn-indiv{ background:var(--indiv); border-bottom-color:var(--indiv-shade); color:#fff; }
  .btn.secondary{ background:var(--accent-light); color:var(--accent); border:2px solid var(--accent-border); border-bottom-width:5px; }
  .btn.ghost{ background:var(--surface); color:var(--sub); border:2px solid var(--hair); border-bottom-width:5px; }
  .btn.ghost:active, .btn.secondary:active{ border-bottom-width:2px; }
  .btn.danger-text{ color:var(--danger); }
  .icon-btn{ background:none; border:none; color:var(--sub); cursor:pointer; padding:4px 8px; min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:12px; }
  .icon-btn:active{ background:var(--track); }

  /* ----- 入力欄 ----- */
  .field-label{ display:block; font-size:13px; font-weight:700; color:var(--sub); margin-bottom:4px; }
  .text-input{
    display:block; width:100%; padding:11px 14px; margin-bottom:14px;
    border:2px solid var(--hair); border-radius:14px; background:var(--surface); color:var(--text);
    font-size:16px; font-family:inherit;
  }
  textarea.text-input{ resize:vertical; line-height:1.5; }
  .text-input:focus{ outline:none; border-color:var(--accent); }
  .text-input.en{ font-family:var(--font-en); }
  .input-with-btn{ display:flex; gap:8px; align-items:flex-start; }
  .input-with-btn .text-input{ flex:1; min-width:0; }
  .input-with-btn .speak-btn{ margin-top:2px; }
  .word-pair{ margin:0 0 18px; padding:12px 12px 0; border:1.5px solid var(--indiv); border-radius:14px; background:var(--indiv-light); }
  .form-section-head{ display:flex; align-items:center; gap:6px; margin:0 0 8px; font-size:14px; font-weight:800; }
  .form-section-opt{ margin-top:4px; }
  .req-badge, .opt-badge{ font-size:11px; font-weight:800; padding:1px 7px; border-radius:8px; }
  .req-badge{ background:var(--indiv); color:#fff; }
  .opt-badge{ background:var(--hair); color:var(--sub); }
  .dup-note{ margin:-6px 0 14px; padding:10px 12px; border-radius:12px; background:var(--surface); border:1.5px dashed var(--indiv); font-size:13.5px; }
  .dup-note p{ margin:0; }
  .dup-note .dup-sub{ margin-top:4px; color:var(--sub); font-size:12.5px; font-weight:700; }
  .dup-note-btn{ display:flex; align-items:center; justify-content:center; gap:5px; width:100%; margin-top:8px; padding:9px; border:2px solid var(--indiv); border-bottom-width:3px; border-radius:10px; background:var(--indiv-light); color:var(--indiv); font-size:14px; font-weight:800; cursor:pointer; }

  /* ----- ホーム ----- */
  .home-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:16px; }
  .brand{ font-size:22px; font-weight:800; color:var(--accent); line-height:1.3; }
  .brand-sub{ font-size:13.5px; color:var(--sub); font-weight:700; margin-top:2px; }
  .my-card{ display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:20px; background:var(--indiv-light); border:2px solid var(--indiv); border-bottom-width:5px; margin-bottom:18px; }
  .my-card-main{ display:flex; align-items:center; gap:12px; width:100%; padding:0; border:none; background:none; text-align:left; cursor:pointer; }
  .my-card-icon{ width:46px; height:46px; border-radius:14px; background:var(--indiv); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .my-card-text{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .my-card-text b{ font-size:18px; font-weight:800; }
  .my-card-text small{ font-size:13px; color:var(--sub); font-weight:700; }
  .my-card-arrow{ color:var(--indiv); flex-shrink:0; }
  .my-card-actions{ display:flex; gap:8px; }
  .my-card-actions .btn{ margin:0; padding:10px 8px; font-size:15px; border-radius:14px; border-bottom-width:4px; }
  .my-card-actions .btn:active{ border-bottom-width:2px; }
  .my-card-actions .btn-outline{ background:var(--surface); color:var(--indiv); border:2px solid var(--indiv); border-bottom-width:4px; }
  .search-box{ position:relative; margin-bottom:18px; }
  .search-box svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--sub); pointer-events:none; }
  .search-box .text-input{ margin:0; padding-left:42px; }
  .section-title{ display:flex; align-items:baseline; gap:8px; font-size:15px; font-weight:800; margin:6px 2px 10px; }
  .section-title small{ font-size:12px; color:var(--sub); font-weight:700; }
  .cat-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .cat-tile{
    display:flex; align-items:center; gap:14px; width:100%; padding:14px 16px; text-align:left;
    background:var(--surface); border:2px solid var(--hair); border-bottom-width:5px; border-radius:18px; cursor:pointer;
  }
  .cat-tile:active{ transform:translateY(3px); border-bottom-width:2px; }
  .cat-icon{ width:48px; height:48px; border-radius:14px; background:var(--accent-light); display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0; }
  .cat-text{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .cat-name{ font-size:17px; font-weight:800; line-height:1.35; }
  .cat-desc{ font-size:12.5px; color:var(--sub); font-weight:700; }
  .cat-count{ display:flex; flex-direction:column; align-items:flex-end; flex-shrink:0; font-size:13px; color:var(--sub); font-weight:800; }
  /* 例文・メモはふだん閉じておき、行をタップしたら開く(単語をぱっと見渡せるように) */
  .item-row:not(.open) .item-details{ display:none; }
  .item-row.open .item-more{ display:none; }
  .item-body.has-details{ cursor:pointer; }
  .item-en .word-pos{ margin-left:8px; vertical-align:3px; font-family:var(--font-ui); -webkit-user-select:none; user-select:none; }
  .item-more{ display:inline-flex; align-items:center; gap:3px; margin-top:4px; font-size:12px; font-weight:800; color:var(--accent); }
  .home-foot{ text-align:center; font-size:12px; color:var(--sub); margin:8px 0 0; }

  /* ----- 一覧の行 ----- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px; }
  .topbar-title{ flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:6px; font-weight:800; font-size:17px; text-align:center; }
  .topbar-spacer{ width:44px; flex-shrink:0; }
  .cat-summary{ text-align:center; font-size:13px; color:var(--sub); font-weight:700; margin:-8px 0 14px; }
  .item-row{
    display:flex; align-items:flex-start; gap:10px; padding:12px 10px 12px 10px; margin-bottom:10px;
    background:var(--surface); border:2px solid var(--hair); border-radius:16px;
  }
  .item-body{ flex:1; min-width:0; }
  .item-en{ font-family:var(--font-en); font-size:18px; font-weight:700; line-height:1.35; overflow-wrap:anywhere; }
  .item-ja{ font-size:15px; color:var(--sub); overflow-wrap:anywhere; margin-top:2px; }
  .item-ex{ margin-top:8px; padding:8px 10px; border-radius:10px; background:var(--track); font-size:14px; line-height:1.5; }
  .item-ex-en{ font-family:var(--font-en); font-weight:600; overflow-wrap:anywhere; }
  .item-ex-ja{ display:block; color:var(--sub); font-size:13px; overflow-wrap:anywhere; }
  .alt-btn{ display:inline-flex; align-items:center; gap:4px; margin-top:6px; padding:3px 10px; border-radius:999px; border:1.5px solid var(--blue); background:var(--surface); color:var(--blue); font-size:12px; font-weight:800; cursor:pointer; }
  .alt-btn:active{ background:var(--blue-light); }
  .alt-tag{ display:inline-flex; align-items:center; height:20px; margin-left:8px; padding:0 7px; border-radius:6px; background:var(--blue-light); color:var(--blue); font-size:11px; font-weight:800; vertical-align:3px; font-family:var(--font-ui); }
  .item-orig{ display:block; font-size:12px; font-weight:700; }
  .item-orig span{ font-family:var(--font-en); }
  .item-row:not(.alts-open) .item-alts{ display:none; }
  .item-alts{ margin-top:8px; padding:6px 8px; border-radius:12px; border:1.5px solid var(--blue-light); background:var(--surface); }
  .alt-line{ display:flex; align-items:center; gap:6px; padding:5px 0; }
  .alt-line + .alt-line{ border-top:1px solid var(--hair); }
  .alt-line .speak-btn-sm{ margin:0; flex-shrink:0; }
  .alt-text{ flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.35; }
  .alt-text b{ font-family:var(--font-en); font-size:15px; overflow-wrap:anywhere; }
  .alt-text small{ font-size:11.5px; color:var(--sub); font-weight:700; }
  .alt-main{ flex-shrink:0; padding:4px 9px; border-radius:8px; border:1.5px solid var(--hair); background:var(--surface); color:var(--sub); font-size:11.5px; font-weight:800; cursor:pointer; }
  .alt-main.on{ border-color:var(--blue); background:var(--blue); color:#fff; cursor:default; }
  .alt-line.is-main b{ color:var(--blue); }
  .flash-alt-row{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:2px; }
  .flash-alt-row .alt-btn{ margin-top:0; }
  .flash-alt-label{ font-size:12px; color:var(--blue); font-weight:800; }
  .flash-alt-label:empty{ display:none; }
  .item-gloss{ display:flex; flex-wrap:wrap; gap:4px 6px; margin-top:7px; font-size:12.5px; line-height:1.5; color:var(--text); }
  .gloss-head{ display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:6px; background:var(--accent-light); color:var(--accent); font-size:11px; font-weight:800; }
  .gloss-item{ padding:1px 8px; border-radius:6px; background:var(--track); }
  .gloss-item b{ font-family:var(--font-en); font-weight:700; }
  .item-note{ display:flex; gap:5px; margin-top:7px; font-size:12.5px; line-height:1.5; color:var(--sub); font-weight:700; }
  .item-note svg{ flex-shrink:0; margin-top:2px; color:var(--gold); }
  .item-tags{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:4px; }
  .word-pos{ display:inline-flex; align-items:center; height:22px; font-weight:800; font-size:12px; color:var(--pos-text); background:var(--accent-light); border-radius:7px; padding:0 8px; }
  .indiv-tag{ display:inline-flex; align-items:center; height:22px; font-size:11.5px; font-weight:800; padding:0 8px; border-radius:7px; background:var(--indiv); color:#fff; }
  .indiv-tag.fav{ background:var(--indiv-light); color:var(--indiv); border:1px solid var(--indiv); }
  .cat-tag{ display:inline-flex; align-items:center; height:22px; font-size:11.5px; font-weight:800; padding:0 8px; border-radius:7px; background:var(--track); color:var(--sub); }
  .item-actions{ display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; }
  .speak-btn{
    width:42px; height:42px; border-radius:12px; border:none; border-bottom:3px solid var(--blue-shade);
    background:var(--blue); color:#fff; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .speak-btn:active{ transform:translateY(2px); border-bottom-width:1px; }
  .speak-btn-sm{ display:inline-flex; align-items:center; justify-content:center; vertical-align:-3px; margin-left:4px; width:26px; height:26px; border:none; border-radius:8px; background:none; color:var(--blue); cursor:pointer; padding:0; }
  .heart-btn, .row-icon-btn{ width:42px; height:38px; border:none; background:none; color:var(--sub); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; border-radius:10px; }
  .heart-btn.on{ color:var(--indiv); }
  .heart-btn.on svg{ animation:heartPop .35s cubic-bezier(.2,.8,.3,1.4); }
  @keyframes heartPop{ 0%{transform:scale(.6);} 100%{transform:scale(1);} }
  .row-icon-btn:active, .heart-btn:active{ background:var(--track); }
  /* 左の「覚えた」チェック(ハングルの卵の個別登録と同じ) */
  .learn-check{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:2px; border:none; background:none; padding:2px 0; cursor:pointer; }
  .learn-check-dot{ width:30px; height:30px; border-radius:50%; border:2px solid var(--hair); background:var(--surface); color:transparent; display:flex; align-items:center; justify-content:center; }
  .learn-check-label{ font-size:10px; font-weight:800; color:var(--sub); white-space:nowrap; }
  .learn-check.on .learn-check-dot{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .learn-check.on .learn-check-label{ color:var(--accent); }
  .empty-state{ text-align:center; color:var(--sub); padding:36px 16px; font-size:15px; }
  .hint{ font-size:12.5px; color:var(--sub); font-weight:700; text-align:center; margin:0 0 12px; }

  /* ----- マイ単語帳 ----- */
  .indiv-add{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%; margin-bottom:14px; padding:13px;
    border:2px solid var(--indiv); border-bottom-width:5px; border-radius:16px; background:var(--indiv-light); color:var(--indiv); font-size:16px; font-weight:800; cursor:pointer;
  }
  .indiv-add:active{ transform:translateY(3px); border-bottom-width:2px; }
  .segmented{ display:flex; background:var(--track); border-radius:14px; padding:3px; gap:3px; margin-bottom:14px; }
  .segmented button{ flex:1; border:none; background:none; padding:8px 4px; border-radius:11px; font-size:14px; font-weight:700; color:var(--sub); cursor:pointer; }
  .segmented button.active{ background:var(--indiv); color:#fff; font-weight:800; box-shadow:inset 0 -3px 0 var(--indiv-shade); }
  .segmented button:disabled{ opacity:.4; cursor:default; }
  .seg-count{ margin-left:4px; font-size:12px; opacity:.85; }
  .segmented.accent button.active{ background:var(--accent); color:var(--on-accent); box-shadow:inset 0 -3px 0 var(--accent-shade); }

  .footer-spacer{ height:96px; }
  .fixed-footer{ position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(to bottom, transparent, var(--bg) 30%); z-index:20; }
  .fixed-footer-inner{ max-width:688px; margin:0 auto; }
  .fixed-footer .btn{ margin-top:0; }

  /* ----- シート(下から出る画面) ----- */
  .sheet-overlay{ position:fixed; inset:0; background:var(--overlay); z-index:100; display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .18s ease-out; }
  .sheet{ background:var(--bg); width:100%; max-width:640px; max-height:88vh; overflow-y:auto; border-radius:22px 22px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom)); animation:sheetUp .22s ease-out; }
  @media (min-width:700px){ .sheet-overlay{ align-items:center; } .sheet{ border-radius:22px; } }
  .sheet-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .sheet-head h1{ margin:0; font-size:19px; }
  .sheet-lead{ margin:-4px 0 14px; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes sheetUp{ from{transform:translateY(24px); opacity:.6;} to{transform:none; opacity:1;} }
  .opt-label{ font-size:13px; font-weight:800; color:var(--sub); margin:0 0 8px; }
  .opt-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0 14px; border-top:1px solid var(--hair); }
  .opt-row > span{ display:flex; flex-direction:column; gap:2px; font-size:15px; }
  .opt-row small{ font-size:12px; color:var(--sub); font-weight:700; }
  .switch{ position:relative; display:inline-block; width:46px; height:28px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch-slider{ position:absolute; inset:0; background:var(--hair); border-radius:999px; cursor:pointer; transition:background .15s ease-out; }

<script>
"use strict";
/* ベビー用品店の接客英語アプリ(Webアプリ版)。
   「ハングルの卵」の個別登録(自作単語+お気に入り・検索・覚えたチェック・フラッシュカード・バックアップ)を
   取り出し、最初から入っている接客フレーズ集と組み合わせたもの。
   データはこの端末のブラウザ(localStorage)にだけ保存する。サーバーには何も送らない。 */

const STORE_KEY = "babyShopEnglish.v1";
const app = document.getElementById("app");

/* ===================== 収録データ ===================== */
const CATEGORIES = PHRASE_BOOK.map(c => ({ id:c.id, kind:c.kind, icon:c.icon, name:c.name, desc:c.desc || "" }));
// 例文(フレーズは本文)の語句の解説(phrases-data.js の PHRASE_NOTES)。「語句＝意味｜語句＝意味」を [[語句, 意味], …] にする
function parseGloss(id){
  const raw = (typeof PHRASE_NOTES !== "undefined" && PHRASE_NOTES[id]) || "";
  return raw.split("｜").map(x => x.trim()).filter(Boolean).map(x => {
    const k = x.indexOf("＝");
    return k > 0 ? [x.slice(0, k), x.slice(k + 1)] : ["", x];
  });
}
// 言い換え(phrases-data.js の PHRASE_ALTS)。「言い方（メモ）｜言い方」を [{en, note}, …] にする
function parseAlts(id){
  const raw = (typeof PHRASE_ALTS !== "undefined" && PHRASE_ALTS[id]) || "";
  return raw.split("｜").map(x => x.trim()).filter(Boolean).map(x => {
    const m = x.match(/^(.*?)（(.*)）$/);
    return m ? { en:m[1].trim(), note:m[2].trim() } : { en:x, note:"" };
  });
}
// 語句の解説の表示(一覧で例文を開いたときだけ。フラッシュカードは情報が多くなるので出さない)
function glossHtml(w, cls){
  if(!w.gloss || w.gloss.length === 0) return "";
  return `<div class="${cls}"><span class="gloss-head">語句</span>${w.gloss.map(([k, v]) =>
    `<span class="gloss-item">${k ? `<b lang="en">${esc(k)}</b>` : ""}${k ? "：" : ""}${esc(v)}</span>`).join("")}</div>`;
}
const BUILTIN = [];
PHRASE_BOOK.forEach(c => c.items.forEach((row, i) => {
  const id = `${c.id}-${i + 1}`;
  if(c.kind === "phrase"){
    const [en, ja, note] = row;
    BUILTIN.push({ id, cat:c.id, en, ja, pos:"", ex_en:"", ex_ja:"", note:note || "", gloss:parseGloss(id), alts:parseAlts(id) });
  } else {
    const [en, ja, pos, ex_en, ex_ja, note] = row;
    BUILTIN.push({ id, cat:c.id, en, ja, pos:pos || "", ex_en:ex_en || "", ex_ja:ex_ja || "", note:note || "", gloss:parseGloss(id), alts:parseAlts(id) });
  }
}));
const BUILTIN_MAP = new Map(BUILTIN.map(w => [w.id, w]));
const catById = id => CATEGORIES.find(c => c.id === id);
const itemsOfCat = id => BUILTIN.filter(w => w.cat === id);

/* ===================== 保存データ ===================== */
function defaultState(){
  return {
    favorites: [],      // ♡を押した収録フレーズのid(マイ単語帳の「お気に入り」)
    customWords: [],    // 自作単語: {id:"c1", en, ja, pos, ex_en, ex_ja, note}
    nextCustomId: 1,
    learned: [],        // 「覚えた」にしたid(収録・自作どちらも)
    seenAt: {},         // id -> 最後にフラッシュカードで見た順番。長く見ていないものから出すのに使う
    seenCount: 0,
    flashFront: "en",   // フラッシュカードの表の面: "en" | "ja"
    flashSkipLearned: true, // マイ単語帳のフラッシュカードで「覚えた」単語を出さないか(始める前に選べる)
    speechRate: "normal", // "normal" | "slow"
    autoSpeak: true,    // フラッシュカードで英語が見えたら読み上げる
    pron: {},           // 発音チェックの記録: id -> {n:回数, ok:80点以上の回数, best:最高点}
    tutorialSeen: false, // 使い方の説明を見終わったか(初めて開いたときだけ自動で出す)
    altMain: {}         // 言い換えをメインに表示している単語: id -> 言い換えの番号
  };
}
const asStr = v => typeof v === "string" ? v : "";
// 自作単語は、保存データ・バックアップのどちらから来ても同じ検証を通す(壊れたデータで画面が落ちないように)
function sanitizeCustomWords(list){
  if(!Array.isArray(list)) return [];
  const seen = new Set();
  return list
    .filter(w => w && typeof w === "object" && /^c\d+$/.test(asStr(w.id)) && asStr(w.en).trim() && asStr(w.ja).trim())
    .filter(w => !seen.has(w.id) && seen.add(w.id))
    .map(w => ({
      id: w.id, en: asStr(w.en).slice(0, 120), ja: asStr(w.ja).slice(0, 120), pos: asStr(w.pos).slice(0, 30),
      ex_en: asStr(w.ex_en).slice(0, 200), ex_ja: asStr(w.ex_ja).slice(0, 200), note: asStr(w.note).slice(0, 200)
    }));
}
function nextIdAfter(words){
  return words.reduce((max, w) => Math.max(max, parseInt(w.id.slice(1), 10) || 0), 0) + 1;
}
function loadState(){
  const base = defaultState();
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); }catch(e){ saved = null; }
  if(!saved || typeof saved !== "object") return base;
  for(const k of Object.keys(base)){
    const v = saved[k];
    if(v === undefined || v === null) continue;
    if(Array.isArray(base[k]) !== Array.isArray(v)) continue;
    if(typeof base[k] !== typeof v) continue;
    base[k] = v;
  }
  base.customWords = sanitizeCustomWords(base.customWords);
  base.favorites = [...new Set(base.favorites.filter(id => typeof id === "string" && BUILTIN_MAP.has(id)))];
  base.learned = [...new Set(base.learned.filter(id => typeof id === "string"))];
  const pronOk = v => v && typeof v === "object" && [v.n, v.ok, v.best].every(x => Number.isFinite(x));
  base.pron = Object.fromEntries(Object.entries(base.pron).filter(([, v]) => pronOk(v)));
  base.altMain = Object.fromEntries(Object.entries(base.altMain).filter(([id, i]) => Number.isInteger(i) && BUILTIN_MAP.has(id) && BUILTIN_MAP.get(id).alts[i]));
  base.nextCustomId = Math.max(base.nextCustomId, nextIdAfter(base.customWords));
  return base;
}
let state = loadState();
let saveWarned = false;
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){
    if(!saveWarned){ saveWarned = true; toast("保存できませんでした（プライベートブラウズでは保存されません）"); }
  }
}

/* ===================== マイ単語帳(自作+お気に入り) ===================== */
const isCustom = w => !BUILTIN_MAP.has(w.id);
const isFav = w => state.favorites.includes(w.id);
const isLearned = w => state.learned.includes(w.id);
function findEntry(id){ return BUILTIN_MAP.get(id) || state.customWords.find(w => w.id === id) || null; }
function getMyEntries(filter){
  const f = filter || "all";
  const custom = f === "favorite" ? [] : state.customWords.slice().reverse();
  const favs = f === "custom" ? [] : state.favorites.map(id => BUILTIN_MAP.get(id)).filter(Boolean).reverse();
  return [...custom, ...favs];
}
function toggleFav(w){
  const i = state.favorites.indexOf(w.id);
  if(i >= 0) state.favorites.splice(i, 1); else state.favorites.push(w.id);
  saveState();
  return i < 0;
}
function toggleLearned(w){
  const i = state.learned.indexOf(w.id);
  if(i >= 0) state.learned.splice(i, 1); else state.learned.push(w.id);
  saveState();
  return i < 0;
}
function removeCustomWord(id){
  state.customWords = state.customWords.filter(w => w.id !== id);
  state.learned = state.learned.filter(x => x !== id);
  delete state.seenAt[id];
  delete state.pron[id];
  saveState();
}

/* ===================== ユーティリティ ===================== */
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// 重複チェック用: 大文字小文字・前後の句読点・空白の違いは同じとみなす
function normEn(s){ return String(s || "").toLowerCase().replace(/[’‘]/g, "'").replace(/[.,!?。、！？]+/g, " ").replace(/\s+/g, " ").trim(); }
function matchesQuery(w, q){
  if(!q) return true;
  return [w.en, w.ja, w.pos, w.ex_en, w.ex_ja, w.note, ...altsOf(w).map(a => a.en)].join("\n").toLowerCase().includes(q);
}
function toast(msg){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ===================== 読み上げ(ブラウザ標準の音声合成) ===================== */
const NOVELTY_VOICE_NAMES = /albert|bad news|bahh|bells|boing|bubbles|cellos|wobble|good news|jester|organ|superstar|trinoids|whisper|zarvox|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley/i;
let cachedVoice = null;
function bestVoice(){
  if(cachedVoice) return cachedVoice;
  if(!("speechSynthesis" in window)) return null;
  const all = window.speechSynthesis.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang || ""));
  if(all.length === 0) return null;
  const normal = all.filter(v => !NOVELTY_VOICE_NAMES.test(v.name));
  const us = normal.filter(v => /^en[-_]us/i.test(v.lang));
  const pool = us.length ? us : (normal.length ? normal : all);
  cachedVoice = pool.find(v => /(enhanced|premium)/i.test(v.name))
    || pool.find(v => /samantha|ava|allison|google us english|aria|jenny/i.test(v.name))
    || pool.find(v => v.localService)
    || pool[0];
  return cachedVoice;
}
if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => { cachedVoice = null; };
function speak(text, slow){
  if(!text) return;
  stopSpeech();
  if(!("speechSynthesis" in window)){ toast("このブラウザでは読み上げが使えません"); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  const v = bestVoice();
  if(v){ u.voice = v; u.lang = v.lang; }
  u.rate = (slow || state.speechRate === "slow") ? 0.7 : 0.95;
  window.speechSynthesis.speak(u);
}
function stopSpeech(){
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  if(currentAudio){
    const a = currentAudio;
    currentAudio = null;
    a.pause();
    // iPhone では、音声を流したあとにすぐマイクを使うと音を拾えないことがある。中身を外して音の出口を手放させる
    a.removeAttribute("src");
    try{ a.load(); }catch(e){}
  }
}
/* 言い換え: 一覧で「メインにする」を押すと、その言い換えを大きく表示し、カードや発音チェックでもそれを使う */
const altsOf = w => w.alts || [];
function mainAltIndex(w){
  const i = state.altMain[w.id];
  return Number.isInteger(i) && altsOf(w)[i] ? i : -1;
}
const displayEn = w => mainAltIndex(w) >= 0 ? w.alts[mainAltIndex(w)].en : w.en;
// カード・発音チェックで「↔ 言い換え」を押したときに切り替える順(今表示しているもの → 元の単語 → ほかの言い換え)
const variantsOf = w => [...new Set([displayEn(w), w.en, ...altsOf(w).map(a => a.en)])];
function variantLabel(w, text){
  if(!altsOf(w).length) return "";
  if(text === w.en) return "元の単語";
  const a = altsOf(w).find(x => x.en === text);
  return a ? `言い換え${a.note ? `（${a.note}）` : ""}` : "";
}
/* 収録済みの単語・例文は、AIで作ったお手本音声(audio/)を鳴らす。音声ファイルが無いもの(自作単語・音声を作る前に足した項目)や、
   文言を書き換えて音声と合わなくなったものは、端末の読み上げにする */
let currentAudio = null;
const AUDIO = window.AUDIO_MANIFEST || {};
// その単語のお手本音声の中から、読み上げたい文と同じものを探す(本文・例文・言い換えのどれでも)
function audioFileFor(w, text){
  const parts = (!isCustom(w) && AUDIO[w.id]) || {};
  const hit = Object.values(parts).find(a => a && a.text === text);
  return hit ? hit.file : null;
}
// part: "word"(いま表示している英語) / "ex"(例文)。それ以外の文字はその文を読む(言い換え)
function playEntry(w, part, slow){
  const text = part === "ex" ? w.ex_en : part === "word" ? displayEn(w) : part;
  playText(w, text, slow);
}
function playText(w, text, slow){
  if(!text) return;
  const file = audioFileFor(w, text);
  if(!file){ speak(text, slow); return; }
  stopSpeech();
  const a = new Audio("audio/" + file);
  a.playbackRate = (slow || state.speechRate === "slow") ? 0.75 : 1;
  a.preservesPitch = true;
  currentAudio = a;
  a.play().catch(() => { if(currentAudio === a) speak(text, slow); });
}

/* ===================== 行(収録・自作共通) ===================== */
// mode: "browse"(カテゴリ・検索。♡を出す) / "my"(マイ単語帳。「覚えた」チェック・編集・削除を出す)
// 「覚えた」チェックはマイ単語帳だけに置く(カテゴリの一覧にまで並べると、どれが何のボタンか分かりにくいため)
function itemRow(w, mode, opts){
  opts = opts || {};
  const custom = isCustom(w);
  const learned = isLearned(w);
  const id = esc(w.id);
  const tags = [];
  if(opts.showSource){
    if(custom) tags.push(`<span class="indiv-tag">自作</span>`);
    else if(mode === "my") tags.push(`<span class="indiv-tag fav">お気に入り</span>`);
    // カテゴリ名は検索結果でだけ出す(マイ単語帳では情報が多くなるので出さない)
    if(!custom && mode !== "my"){ const c = catById(w.cat); if(c) tags.push(`<span class="cat-tag">${esc(c.name)}</span>`); }
  }
  if(state.pron[w.id]) tags.push(`<span class="pron-tag">発音 ${state.pron[w.id].best}点</span>`);
  const hasDetails = !!(w.ex_en || w.ex_ja || w.note || (w.gloss && w.gloss.length));
  // 言い換えはカテゴリの一覧と検索結果でだけ扱う(マイ単語帳では情報が多くなるので、メインにした言い方を表示するだけ)
  const alts = mode === "my" ? [] : altsOf(w);
  const mainAlt = mode === "my" ? -1 : mainAltIndex(w);
  // 言い換えの一覧(元の単語も並べ、どれをメインに表示するか選べる)
  const altLine = (text, note, i) => `<div class="alt-line${i === mainAlt ? " is-main" : ""}">
      <button class="speak-btn-sm" data-act="alt-speak" data-i="${i}" aria-label="発音を聞く">${ICON.speaker(15)}</button>
      <span class="alt-text"><b lang="en">${esc(text)}</b>${note ? `<small>${esc(note)}</small>` : ""}</span>
      ${i === mainAlt ? `<span class="alt-main on">メイン</span>` : `<button class="alt-main" data-act="alt-main" data-i="${i}">${i < 0 ? "元に戻す" : "メインにする"}</button>`}
    </div>`;
  const altsHtml = alts.length ? `
    <div class="item-alts">
      ${altLine(w.en, "元の単語", -1)}
      ${alts.map((a, i) => altLine(a.en, a.note, i)).join("")}
    </div>` : "";
  const actions = mode === "my"
    ? `<button class="speak-btn" data-act="speak" aria-label="発音を聞く">${ICON.speaker(18)}</button>
       ${custom
         ? `<button class="row-icon-btn" data-act="edit" aria-label="編集">${ICON.pencil(17)}</button>`
         : ""}
       <button class="row-icon-btn" data-act="remove" aria-label="${custom ? "削除" : "マイ単語帳から外す"}">${ICON.close(15)}</button>`
    : `<button class="speak-btn" data-act="speak" aria-label="発音を聞く">${ICON.speaker(18)}</button>
       <button class="heart-btn${isFav(w) ? " on" : ""}" data-act="fav" aria-pressed="${isFav(w)}" aria-label="マイ単語帳に入れる">${ICON.heart(22, isFav(w))}</button>`;
  return `
    <div class="item-row" data-id="${id}" data-mode="${mode}" data-src="${opts.showSource ? 1 : 0}" data-q="${esc([w.en, w.ja, w.pos, w.ex_en, w.ex_ja, w.note, ...alts.map(a => a.en)].join("\n").toLowerCase())}">
      ${mode === "my" ? `<button class="learn-check${learned ? " on" : ""}" data-act="learn" aria-pressed="${learned}" aria-label="覚えた"><span class="learn-check-dot">${ICON.check(15)}</span><span class="learn-check-label">覚えた</span></button>` : ""}
      <div class="item-body${hasDetails ? " has-details" : ""}"${hasDetails ? ` data-toggle aria-expanded="false"` : ""}>
        ${tags.length ? `<div class="item-tags">${tags.join("")}</div>` : ""}
        <div class="item-en"><span lang="en">${esc(displayEn(w))}</span>${mainAlt >= 0 ? `<span class="alt-tag">言い換え</span>` : ""}${w.pos ? `<span class="word-pos">${esc(w.pos)}</span>` : ""}</div>
        <div class="item-ja">${esc(w.ja)}${mainAlt >= 0 ? `<span class="item-orig">元の単語：<span lang="en">${esc(w.en)}</span></span>` : ""}</div>
        ${alts.length ? `<button class="alt-btn" data-act="alts" aria-expanded="false">${ICON.swap(13)}言い換え ${alts.length}</button>` : ""}
        ${altsHtml}
        ${hasDetails ? `<span class="item-more">${w.ex_en || w.ex_ja ? "例文" : "解説"}を見る ▾</span>` : ""}
        <div class="item-details">
          ${w.ex_en || w.ex_ja ? `<div class="item-ex">${w.ex_en ? `<span class="item-ex-en" lang="en">${esc(w.ex_en)}</span><button class="speak-btn-sm" data-act="speak-ex" aria-label="例文を聞く">${ICON.speaker(15)}</button>` : ""}${w.ex_ja ? `<span class="item-ex-ja">${esc(w.ex_ja)}</span>` : ""}</div>` : ""}
          ${glossHtml(w, "item-gloss")}
          ${w.note ? `<div class="item-note">${ICON.bulb(14)}<span>${esc(w.note)}</span></div>` : ""}
        </div>
      </div>
      <div class="item-actions">${actions}</div>
    </div>`;
}
// 行のボタンは一覧の要素にまとめて付ける(描き直さずに見た目だけ変えて、検索中のキーボードを閉じない)
function bindRows(container, hooks){
  hooks = hooks || {};
  container.addEventListener("click", e => {
    const btn = e.target.closest("[data-act]");
    if(!btn || !container.contains(btn)){
      // 行の文字の部分をタップしたら、例文・メモを開け閉めする(英語を選択してコピーしているときは開閉しない)
      const toggle = e.target.closest("[data-toggle]");
      if(toggle && container.contains(toggle) && !String(window.getSelection && window.getSelection()).trim()){
        const open = toggle.closest(".item-row").classList.toggle("open");
        toggle.setAttribute("aria-expanded", open);
      }
      return;
    }
    const row = btn.closest(".item-row");
    const w = row && findEntry(row.dataset.id);
    if(!w) return;
    const act = btn.dataset.act;
    if(act === "speak") playEntry(w, "word");
    else if(act === "alts"){
      const open = row.classList.toggle("alts-open");
      btn.setAttribute("aria-expanded", open);
    } else if(act === "alt-speak"){
      const i = Number(btn.dataset.i);
      playText(w, i < 0 ? w.en : w.alts[i].en);
    } else if(act === "alt-main"){
      const i = Number(btn.dataset.i);
      if(i < 0) delete state.altMain[w.id]; else state.altMain[w.id] = i;
      saveState();
      toast(i < 0 ? "元の単語に戻しました" : `「${w.alts[i].en}」をメインにしました`);
      // その行だけ描き直す(開いていた言い換え・例文はそのまま)
      const wasOpen = row.classList.contains("open");
      const tmp = document.createElement("div");
      tmp.innerHTML = itemRow(w, row.dataset.mode, { showSource: row.dataset.src === "1" });
      const fresh = tmp.firstElementChild;
      fresh.classList.add("alts-open");
      fresh.classList.toggle("open", wasOpen);
      row.replaceWith(fresh);
      playText(w, displayEn(w));
    }
    else if(act === "speak-ex") playEntry(w, "ex");
    else if(act === "fav"){
      const on = toggleFav(w);
      btn.classList.toggle("on", on);
      btn.setAttribute("aria-pressed", on);
      btn.innerHTML = ICON.heart(22, on);
      toast(on ? "マイ単語帳に入れました" : "マイ単語帳から外しました");
      if(hooks.onChange) hooks.onChange();
    } else if(act === "learn"){
      const on = toggleLearned(w);
      btn.classList.toggle("on", on);
      btn.setAttribute("aria-pressed", on);
      if(hooks.onChange) hooks.onChange();
    } else if(act === "edit" && hooks.onEdit) hooks.onEdit(w);

// 一覧の絞り込み: 行の表示だけ切り替える
function filterRows(container, query, noHitEl){
  const q = query.trim().toLowerCase();
  let hits = 0;
  container.querySelectorAll(".item-row").forEach(row => {
    const show = !q || row.dataset.q.includes(q);
    row.style.display = show ? "" : "none";
    if(show) hits++;
  });
  if(noHitEl) noHitEl.style.display = hits === 0 && q ? "" : "none";
  return hits;
}

function openSheet(html, onClose){
  const ov = document.createElement("div");
  ov.className = "sheet-overlay";
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(ov);
  document.body.classList.add("sheet-open");
  const close = () => {
    if(!ov.isConnected) return;
    ov.remove();
    if(!document.querySelector(".sheet-overlay")) document.body.classList.remove("sheet-open");
    if(onClose) onClose();
  };
  ov._close = close;
  ov.addEventListener("click", e => { if(e.target === ov) close(); });
  ov.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  return { ov, close, $: sel => ov.querySelector(sel) };
}

/* ===================== 単語の追加・編集 =====================
   日本語を入れると英語の候補が出て、選ぶだけで登録できるようにする。
   候補は (1) 収録済みの単語・フレーズ (2) 自動翻訳(Chromeの端末内翻訳が使えればそれ、なければ MyMemory の無料翻訳API)。 */
const translateCache = new Map();
let chromeTranslator = null; // null=まだ調べていない / false=使えない
// 応答が返ってこないことがあるので、待つのは決めた時間まで
const withTimeout = (promise, ms) => Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))]);
async function getChromeTranslator(){
  if(chromeTranslator !== null) return chromeTranslator || null;
  chromeTranslator = false;
  try{
    if("Translator" in self){
      const a = await withTimeout(self.Translator.availability({ sourceLanguage:"ja", targetLanguage:"en" }), 1500);
      if(a === "available") chromeTranslator = await withTimeout(self.Translator.create({ sourceLanguage:"ja", targetLanguage:"en" }), 3000);
    }
  }catch(e){ chromeTranslator = false; }
  return chromeTranslator || null;
}
async function translateJaToEn(text){
  if(translateCache.has(text)) return translateCache.get(text);
  const out = [];
  const t = await getChromeTranslator();
  if(t){ try{ out.push(await withTimeout(t.translate(text), 3000)); }catch(e){} }
  try{
    const res = await fetch("https://api.mymemory.translated.net/get?langpair=ja%7Cen&q=" + encodeURIComponent(text), { signal:AbortSignal.timeout(8000) });
    if(res.ok){
      const data = await res.json();
      if(data && Number(data.responseStatus) === 200){
        out.push(data.responseData && data.responseData.translatedText);
        (Array.isArray(data.matches) ? data.matches : [])
          .filter(m => (Number(m.match) || 0) >= 0.7)
          .sort((a, b) => (Number(b.match) || 0) - (Number(a.match) || 0))
          .forEach(m => out.push(m.translation));
      }
    }
  }catch(e){}
  const seen = new Set();
  const list = out
    .map(x => String(x || "").replace(/\s+/g, " ").trim())
    .filter(x => x && x.length <= 120 && !/[ぁ-んァ-ヶ一-龠]/.test(x) && !/MYMEMORY|QUERY LENGTH/i.test(x))
    .filter(x => { const k = normEn(x); if(!k || seen.has(k)) return false; seen.add(k); return true; })
    .slice(0, 4);
  if(list.length) translateCache.set(text, list);
  return list;
}
// 収録済みの単語で、日本語の意味が入れた言葉と重なるもの
function builtinCandidates(ja){
  const q = ja.trim();
  if(!q) return [];
  const core = x => x.replace(/[（(].*?[)）]/g, "").replace(/[。、？！?!・〜]/g, "");
  return BUILTIN.filter(w => {
    const j = core(w.ja);
    return j.includes(q) || (j.length >= 2 && q.includes(j));
  }).slice(0, 3);
}

      ${builtins.map(w => item(w.en, w.ja, "収録済み")).join("")}
      ${translations.filter(t => !builtins.some(w => normEn(w.en) === normEn(t))).map(t => item(t, "", "")).join("")}
      ${loading ? `<div class="suggest-status">翻訳しています…</div>` : ""}
      ${!loading && builtins.length === 0 && translations.length === 0 ? `<div class="suggest-status">候補が見つかりませんでした。英語を直接入れてください</div>` : ""}
      ${translations.length ? `<p class="suggest-credit">自動翻訳の候補です。お客さまに使う前に、お手本を聞いて確かめてください</p>` : ""}`;
    box.hidden = false;
  };
  const updateSuggest = () => {
    const q = jaIn.value.trim();
    clearTimeout(timer);
    const token = ++reqToken;
    const builtins = builtinCandidates(q);
    if(!q || translateCache.has(q)){ renderSuggest(builtins, translateCache.get(q) || [], false, q); return; }
    renderSuggest(builtins, [], true, q);
    timer = setTimeout(async () => {
      const list = await translateJaToEn(q);
      if(token !== reqToken || !ov.isConnected) return;
      renderSuggest(builtins, list, false, q);
    }, 450);
  };
  box.addEventListener("click", e => {
    const b = e.target.closest("[data-en]");
    if(!b) return;
    enIn.value = b.dataset.en;
    box.querySelectorAll(".suggest-item").forEach(x => x.classList.toggle("picked", x === b));
    checkValid();
    checkDuplicate();
    playEntry(BUILTIN.find(w => normEn(w.en) === normEn(b.dataset.en)) || { id:"preview", en:b.dataset.en }, "word");
  });
  // 日本語の変換中は翻訳しない(確定してから)
  jaIn.addEventListener("input", e => { checkValid(); if(!e.isComposing) updateSuggest(); });
  jaIn.addEventListener("compositionend", updateSuggest);
  enIn.addEventListener("input", () => { checkValid(); checkDuplicate(); box.querySelectorAll(".suggest-item").forEach(x => x.classList.toggle("picked", normEn(x.dataset.en) === normEn(enIn.value))); });
  checkValid();
  checkDuplicate();
  if(!isEdit && src.ja) updateSuggest();
  $("#btnPreview").onclick = () => { if(enIn.value.trim()) speak(enIn.value.trim()); else enIn.focus(); };
  // Return でキーボードを閉じる(日本語の変換確定の Enter では閉じない)
  $(".sheet").querySelectorAll("input").forEach(inp => {
    inp.setAttribute("enterkeyhint", "done");
    inp.addEventListener("keydown", e => { if(e.key === "Enter" && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); inp.blur(); } });
  });
  submit.onclick = () => {
    const fields = {
      en: enIn.value.trim().slice(0, 120),
      ja: jaIn.value.trim().slice(0, 120),
      pos: $("#inPos").value.trim().slice(0, 30),
      ex_en: $("#inExEn").value.trim().slice(0, 200),
      ex_ja: $("#inExJa").value.trim().slice(0, 200),
      note: $("#inNote").value.trim().slice(0, 200)
    };
    if(!fields.en || !fields.ja) return;
    if(isEdit){
      // 同じオブジェクトを書き換える。フラッシュカードの出題順も同じ参照を持っているので、開いているカードにも反映される
      Object.assign(existing, fields);
    } else {
      state.customWords.push({ id: "c" + (state.nextCustomId++), ...fields });
    }
    saveState();
    toast(isEdit ? "保存しました" : "マイ単語帳に追加しました");
    close();
    if(onSaved) onSaved();
  };
  const del = $("#btnDelete");
  if(del) del.onclick = () => {
    if(!confirmRemoveCustom(existing)) return;
    close();
    if(flash){ flash.queue = flash.queue.filter(w => w.id !== existing.id); }
    if(onSaved) onSaved(true);
  };
  if(!isEdit && !src.ja && !src.en) setTimeout(() => jaIn.focus(), 60);
  else if(!isEdit && src.en && !src.ja) setTimeout(() => jaIn.focus(), 60);
}

/* ===================== フラッシュカード ===================== */
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// 長く見ていないものから出す(まだ見ていないものが先。同じ順位の中はシャッフル)
function orderForFlash(entries){
  return shuffle(entries.slice()).sort((a, b) => (state.seenAt[a.id] || 0) - (state.seenAt[b.id] || 0));
}
// 始める前に、出題のしかた(英語→日本語 か 日本語→英語)を選ぶ(選んだ内容は次回も使う)。
// マイ単語帳から始めるときは(learnedOption)、一覧で「覚えた」にした単語を出すかどうかも選べる(最初は「出さない」)
function startFlash(entries, title, back, tone, opts){
  if(entries.length === 0) return;
  const learnedCount = opts && opts.learnedOption ? entries.filter(isLearned).length : 0;
  let skip = learnedCount > 0 && state.flashSkipLearned !== false;
  let front = state.flashFront === "ja" ? "ja" : "en";
  const { close, $ } = openSheet(`
    ${sheetHead("フラッシュカード")}
    <p class="sub sheet-lead">${esc(title)}</p>
    <div class="opt-label">出題のしかた</div>
    <div class="segmented ${tone === "indiv" ? "" : "accent"}" id="flashFrontSeg">
      <button data-front="en">英語 → 日本語</button>
      <button data-front="ja">日本語 → 英語</button>
    </div>
    ${learnedCount ? `<div class="opt-row">
      <span><b>「覚えた」単語は出さない</b><small>覚えた ${learnedCount}語 / ${entries.length}語</small></span>
      <label class="switch"><input type="checkbox" id="flashSkip" ${skip ? "checked" : ""} aria-label="「覚えた」単語は出さない"><span class="switch-slider"></span></label>
    </div>
    <p class="sub" id="flashAllLearned" style="text-align:center; font-size:14px; margin:0 0 4px; display:none;">すべて「覚えた」になっています 🎉<br>スイッチを切ると、もう一度めくれます</p>` : ""}
    <button class="btn ${tone === "indiv" ? "btn-indiv" : ""}" id="btnFlashStart"></button>
  `);
  const queue = () => skip ? entries.filter(w => !isLearned(w)) : entries;
  const update = () => {
    document.querySelectorAll("#flashFrontSeg [data-front]").forEach(b => b.classList.toggle("active", b.dataset.front === front));
    const n = queue().length;
    const startBtn = $("#btnFlashStart");
    startBtn.textContent = `${n}枚をめくる`;
    startBtn.disabled = n === 0;
    const allLearned = $("#flashAllLearned");
    if(allLearned) allLearned.style.display = n === 0 ? "" : "none";
  };
  document.querySelectorAll("#flashFrontSeg [data-front]").forEach(b => b.onclick = () => { front = b.dataset.front; update(); });
  const skipInput = $("#flashSkip");
  if(skipInput) skipInput.onchange = e => { skip = e.target.checked; update(); };
  $("#btnFlashStart").onclick = () => {
    state.flashFront = front;
    if(learnedCount) state.flashSkipLearned = skip;
    saveState();
    close();
    flash = { queue:orderForFlash(queue()), idx:0, front, title, back, tone, slideFrom:null, notedIdx:null, spokenIdx:null, keepFlip:false };
    go("flash");
  };
  update();
}
function finishFlash(){
  const back = flash ? flash.back : { view:"home" };
  flash = null;
  if(back.catId) currentCatId = back.catId;
  go(back.view || "home");
}
function renderFlashcard(){
  if(!flash){ go("home"); return; }
  stopSpeech();
  if(flash.idx >= flash.queue.length){ renderFlashEnd(); return; }
  const w = flash.queue[flash.idx];
  const n = flash.queue.length;
  const isFirst = flash.idx === 0;
  const isLast = flash.idx === n - 1;
  const custom = isCustom(w);
  const toneVar = flash.tone === "indiv" ? "var(--indiv)" : "var(--accent)";
  const slideFrom = flash.slideFrom;
  flash.slideFrom = null;
  if(flash.notedIdx !== flash.idx){
    // 表示した時点で「見た」とみなす(フラッシュカードには正解・不正解が無いため)
    flash.notedIdx = flash.idx;
    state.seenCount++;
    state.seenAt[w.id] = state.seenCount;
    saveState();
  }
  const jaFront = flash.front === "ja";
  // カードには言い換えの切り替えや印は出さない(情報が増えてややこしくなるため)。一覧でメインにした言い方だけを表示する
  const shownEn = () => displayEn(w);
  const enHtml = `<div class="flash-en-row"><div class="flash-en${shownEn().length > 28 ? " long" : ""}" lang="en">${esc(shownEn())}</div><button class="speak-btn" id="flashSpeak" aria-label="発音を聞く">${ICON.speaker(18)}</button></div>`;
  const jaHtml = `<div class="flash-ja">${esc(w.ja)}</div>`;
  const source = custom ? "自作" : (catById(w.cat) || {}).name || "";
  const keepFlip = flash.keepFlip && !!document.querySelector("#flashInner.flipped");
  flash.keepFlip = false;
  app.innerHTML = `
    <div class="progress-row" style="--fc-tone:${toneVar};">
      <button class="icon-btn" id="btnFlashPause" aria-label="一覧に戻る" style="margin-left:-8px;">${ICON.left(22)}</button>
      <div class="progress-label">${flash.idx + 1} / ${n}</div>
    </div>
    <div class="flash-dots" aria-hidden="true" style="--fc-tone:${toneVar};"><div class="flash-dots-fill" style="width:${Math.round(100 * (flash.idx + 1) / n)}%;"></div></div>
    <div class="flashcard-wrap" id="flashWrap">
      <div class="flashcard-slide${slideFrom ? ` flash-in-${slideFrom}` : ""}" id="flashSlide">
        <div class="flashcard-inner${keepFlip ? " flipped" : ""}" id="flashInner" role="button" tabindex="0" aria-label="カードをめくる">
          <div class="flashcard-face flashcard-front">
            <span class="flash-corner-left">${esc(source)}</span>
            ${custom ? `<button class="flash-corner" data-flash-edit>編集</button>` : ""}
            <div class="flashcard-body">
              ${w.pos ? `<span class="word-pos">${esc(w.pos)}</span>` : ""}
              ${jaFront ? jaHtml : enHtml}
              <p class="flash-tap">${jaFront ? "英語で言ってみてから、タップして答えを見る" : "タップして意味を見る"}</p>
            </div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="flash-corner-left">${esc(source)}</span>
            ${custom ? `<button class="flash-corner" data-flash-edit>編集</button>` : ""}
            <div class="flashcard-body">
              ${jaFront ? enHtml.replace('id="flashSpeak"', 'id="flashSpeakBack"') : jaHtml}
              ${w.ex_en || w.ex_ja ? `<div class="flash-ex">${w.ex_en ? `<div class="flash-ex-en" lang="en">${esc(w.ex_en)}<button class="speak-btn-sm" id="flashSpeakEx" aria-label="例文を聞く">${ICON.speaker(15)}</button></div>` : ""}${w.ex_ja ? `<div class="flash-ex-ja">${esc(w.ex_ja)}</div>` : ""}</div>` : ""}
              ${w.note ? `<div class="flash-note">${esc(w.note)}</div>` : ""}
            </div>
          </div>
        </div>
      </div>
    </div>
    <p class="flash-hint">左右にスワイプでもめくれます</p>
    <div class="flash-nav">
      <button class="btn secondary" id="btnFlashPrev" ${isFirst ? "disabled" : ""}>${ICON.left(18)}前へ</button>
      <button class="btn ${flash.tone === "indiv" ? "btn-indiv" : ""}" id="btnFlashNext">${isLast ? "おわり" : "次へ"}${ICON.right(18)}</button>
    </div>
  `;
  const inner = document.getElementById("flashInner");
  const slide = document.getElementById("flashSlide");
  let swiped = false;
  const flip = () => {
    inner.classList.toggle("flipped");
    // 日本語が表のときは、裏返して英語が見えたときに読み上げる
    if(jaFront && inner.classList.contains("flipped") && state.autoSpeak && flash.spokenIdx !== flash.idx){
      flash.spokenIdx = flash.idx;
      playEntry(w, "word");
    }
  };
  inner.onclick = () => { if(swiped){ swiped = false; return; } flip(); };
  inner.addEventListener("keydown", e => { if(e.key === "Enter" && e.target === inner){ e.preventDefault(); flip(); } });
  const goFlash = delta => {
    if(delta < 0 && isFirst) return;
    slide.style.transition = "transform .18s ease-in, opacity .18s ease-in";
    slide.style.transform = `translateX(${delta > 0 ? -120 : 120}%) rotate(${delta > 0 ? -6 : 6}deg)`;
    slide.style.opacity = "0";
    setTimeout(() => {
      flash.idx += delta;
      flash.slideFrom = delta > 0 ? "right" : "left";
      renderFlashcard();
    }, 170);
  };
  // 紙の単語帳のように、左右にスワイプしてめくる(指に合わせてカードが動き、離した位置で次/前を決める)
  const wrap = document.getElementById("flashWrap");
  let sx = null, sy = null, dx = 0, horizontal = null;
  wrap.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; horizontal = null; slide.style.transition = "none"; }, { passive:true });
  wrap.addEventListener("touchmove", e => {
    if(sx === null) return;
    dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    if(horizontal === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) horizontal = Math.abs(dx) > Math.abs(dy);
    if(!horizontal) return;
    e.preventDefault();
    const moved = dx > 0 && isFirst ? dx * 0.25 : dx; // 最初のカードで右に引っぱっても少ししか動かさない
    slide.style.transform = `translateX(${moved}px) rotate(${moved / 40}deg)`;
  }, { passive:false });
  wrap.addEventListener("touchend", () => {
    if(sx === null) return;
    sx = null;
    if(!horizontal){ slide.style.transition = ""; slide.style.transform = ""; return; }
    swiped = true;
    setTimeout(() => { swiped = false; }, 400);
    if(dx < -60) goFlash(1);
    else if(dx > 60 && !isFirst) goFlash(-1);
    else { slide.style.transition = "transform .2s ease-out"; slide.style.transform = ""; }
  });
  const speakBtn = id => { const b = document.getElementById(id); if(b) b.onclick = e => { e.stopPropagation(); playText(w, shownEn()); }; };
  speakBtn("flashSpeak");
  speakBtn("flashSpeakBack");
  const exBtn = document.getElementById("flashSpeakEx");
  if(exBtn) exBtn.onclick = e => { e.stopPropagation(); playEntry(w, "ex"); };
  document.querySelectorAll("[data-flash-edit]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    showAddWordSheet(w, deleted => {
      if(deleted){
        if(flash.queue.length === 0){ finishFlash(); return; }
        flash.idx = Math.min(flash.idx, flash.queue.length);
        flash.notedIdx = null;
      } else flash.keepFlip = true;
      renderFlashcard();
    });
  });
  document.getElementById("btnFlashPause").onclick = finishFlash;
  document.getElementById("btnFlashPrev").onclick = () => goFlash(-1);
  document.getElementById("btnFlashNext").onclick = () => goFlash(1);
  flashControls = { next:() => goFlash(1), prev:() => goFlash(-1), flip };
  // 英語が表のときは、新しいカードが出たら読み上げる(設定でオフにできる)。編集して描き直したときは鳴らし直さない
  if(!jaFront && state.autoSpeak && flash.spokenIdx !== flash.idx){
    flash.spokenIdx = flash.idx;
    playEntry(w, "word");
  }
}
// 最後までめくったあと: (覚えていないものだけ / すべて)もう一度 / 一覧に戻る
function renderFlashEnd(){
  const n = flash.queue.length;
  const notLearned = flash.queue.filter(w => !isLearned(w));
  const indiv = flash.tone === "indiv";
  app.innerHTML = `
    <div class="progress-row">
      <button class="icon-btn" id="btnFlashPause" aria-label="一覧に戻る" style="margin-left:-8px;">${ICON.left(22)}</button>
      <div class="progress-label">${n} / ${n}</div>
    </div>
    <div class="flash-dots" aria-hidden="true" style="--fc-tone:${indiv ? "var(--indiv)" : "var(--accent)"};"><div class="flash-dots-fill" style="width:100%;"></div></div>
    <div class="flash-end flash-in-right">
      <div class="flash-end-mark" style="background:${indiv ? "var(--indiv-light)" : "var(--accent-light)"}; color:${indiv ? "var(--indiv)" : "var(--accent)"};">${indiv ? ICON.heart(30, true) : ICON.check(30)}</div>
      <h1>${n}枚 見終わりました</h1>
      <p class="sub">お客さまの前で口から出るまで、くり返してみましょう</p>
    </div>
    ${notLearned.length > 0 && notLearned.length < n
      ? `<button class="btn ${indiv ? "btn-indiv" : ""}" id="btnFlashNotLearned">覚えていない${notLearned.length}枚をもう一度</button>
         <button class="btn secondary" id="btnFlashRestart">${n}枚すべてもう一度</button>`
      : `<button class="btn ${indiv ? "btn-indiv" : ""}" id="btnFlashRestart">もう一度最初から</button>`}
    <button class="btn ghost" id="btnFlashFinish">一覧に戻る</button>
  `;
  const restart = queue => {
    flash.queue = queue;
    flash.idx = 0; flash.slideFrom = "right"; flash.notedIdx = null; flash.spokenIdx = null;
    renderFlashcard();
  };
  document.getElementById("btnFlashRestart").onclick = () => restart(orderForFlash(flash.queue));
  const nl = document.getElementById("btnFlashNotLearned");
  if(nl) nl.onclick = () => restart(notLearned);
  document.getElementById("btnFlashPause").onclick = finishFlash;
  document.getElementById("btnFlashFinish").onclick = finishFlash;
}

/* ===================== 発音チェック =====================
   ブラウザの音声認識(iPhoneのSafari・パソコンのChrome)で話した英語を文字にし、お手本とどれだけ一致したかで点数を出す。
   音の細かい正確さではなく「英語として聞き取ってもらえたか」を測る(接客で通じるかの目安)。80点以上を正解とする。 */
const PRON_PASS = 80;
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let pron = null;       // 発音チェックの進行
let currentRec = null; // 聞き取り中の音声認識
let recRunning = 0; // 終わりきっていない聞き取りの数(前のが終わる前に次を始めると、iPhone では失敗することがある)
function stopListening(){
  if(!currentRec) return;
  const r = currentRec;
  currentRec = null;
  try{ r.abort(); }catch(e){}
}
const CONTRACTIONS = { "i'd":"i would", "it's":"it is", "here's":"here is", "what's":"what is", "that's":"that is", "there's":"there is",
  "can't":"can not", "don't":"do not", "we'll":"we will", "i'm":"i am", "you're":"you are", "let's":"let us", "we're":"we are", "isn't":"is not", "we've":"we have" };
// 比べるための単語の並び(小文字・記号なし・短縮形はのばす)
function pronTokens(text){
  const out = [];
  String(text || "").toLowerCase().replace(/[’‘]/g, "'").replace(/-/g, " ").replace(/[^a-z0-9' ]+/g, " ").split(/\s+/).forEach(t => {
    if(!t) return;
    const full = CONTRACTIONS[t] || (t === "cannot" ? "can not" : t.replace(/'/g, ""));
    out.push(...full.split(" ").filter(Boolean));
  });
  return out;
}
function lev(a, b){
  if(a === b) return 0;
  let prev = Array.from({ length:b.length + 1 }, (_, j) => j);
  for(let i = 1; i <= a.length; i++){
    const cur = [i];
    for(let j = 1; j <= b.length; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}
const strSim = (a, b) => (a.length || b.length) ? 1 - lev(a, b) / Math.max(a.length, b.length) : 1;
// 発音の近さを比べるための簡単な「音のかたち」。nap と knap、canopy と kanopy のような、つづりだけの違いを同じにする。
// 母音の違い(seat と sit、crib と crab)や、r と l、b と v は区別する(日本人が間違えやすい所なので甘くしない)
function soundKey(word){
  let w = String(word).toLowerCase().replace(/[^a-z]/g, "");
  if(w.length > 3) w = w.replace(/e$/, "");
  w = w.replace(/^(kn|gn|pn|wr)/, m => m[1])
    .replace(/ph/g, "f").replace(/gh(?![aeiou])/g, "").replace(/ck/g, "k").replace(/tch/g, "ch").replace(/dge/g, "j")
    .replace(/(t|s)ion/g, "shan").replace(/c(?=[eiy])/g, "s").replace(/c/g, "k").replace(/q/g, "k").replace(/x/g, "ks")
    .replace(/z/g, "s").replace(/wh/g, "w");
  if(!w) return "";
  const head = /[aeiouy]/.test(w[0]) ? "a" : w[0];
  return (head + w.slice(1).replace(/[aeiouy]+/g, m => m[0] === "y" ? "i" : m[0])).replace(/(.)\1+/g, "$1");
}
// 同じ音の別の単語。音声認識はよく使うほうの単語で返してくるので、収録語でよく起きる聞き違いは言えたとみなす
const HOMOPHONES = { "break":"brake", "wait":"weight", "way":"weigh", "sail":"sale", "seam":"seem", "plain":"plane",
  "pare":"pair", "pear":"pair", "hole":"whole", "wear":"where", "four":"for", "to":"two", "too":"two", "right":"write", "buy":"by", "bye":"by" };
const sameSound = (a, b) => soundKey(a) === soundKey(b) || HOMOPHONES[a] === b || HOMOPHONES[b] === a || (HOMOPHONES[a] && HOMOPHONES[a] === HOMOPHONES[b]);
// 単語が「言えた」とみなすか(複数形などの小さな違いは許す)
const sameWord = (a, b) => a === b || (a.length > 3 && strSim(a, b) >= 0.75) || (a.length > 2 && sameSound(a, b));
// お手本の各単語が、聞き取れた言葉の中に順番どおり出てきたか
function matchedWords(T, H){
  const dp = Array.from({ length:T.length + 1 }, () => new Array(H.length + 1).fill(0));
  for(let i = 1; i <= T.length; i++) for(let j = 1; j <= H.length; j++){
    dp[i][j] = sameWord(T[i - 1], H[j - 1]) ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
  }
  const hits = new Array(T.length).fill(false);
  let i = T.length, j = H.length;
  while(i > 0 && j > 0){
    if(sameWord(T[i - 1], H[j - 1]) && dp[i][j] === dp[i - 1][j - 1] + 1){ hits[i - 1] = true; i--; j--; }
    else if(dp[i - 1][j] >= dp[i][j - 1]) i--;
    else j--;
  }
  return hits;
}
// 0〜100点。単語ごとの一致(言い落とし・言い間違い)と、文字の近さ(つづりの近い聞き違い)を合わせる
function scorePron(target, heard){
  const T = pronTokens(target), H = pronTokens(heard);
  if(!T.length || !H.length) return { score:0, hits:T.map(() => false), heard };
  let sim, hits;
  if(T.length === 1){
    // 1語のときは、前後に余計な言葉(the など)が付いても下げない。2語に分かれて聞こえた場合(highchair など)も見る
    const cands = [H.join(" "), H.join(""), ...H, ...H.slice(1).map((h, k) => H[k] + h)];
    // 短い単語は1文字違いでも別の単語になる(frame と flame、lock と rock)ので、つづりの近さは厳しめに見る。
    // そのかわり、音が同じもの(break と聞き取られた brake)と、複数形の s が付いただけのものは言えたとみなす
    const t = T[0];
    sim = Math.max(...cands.map(c => Math.max(
      Math.pow(strSim(t, c), 1.6),
      c === t + "s" || t === c + "s" ? 0.95 : 0,
      sameSound(t, c) ? 0.92 : 0)));
    hits = [sim >= PRON_PASS / 100];
  } else {
    hits = matchedWords(T, H);
    const extra = Math.max(0, H.length - T.length);
    const wordSim = hits.filter(Boolean).length / (T.length + extra * 0.5);
    sim = (strSim(T.join(" "), H.join(" ")) + wordSim) / 2;
    // 「high chair」が「highchair」と聞き取られたような、区切り方だけの違いは言えたとみなす
    const joined = strSim(T.join(""), H.join(""));
    if(joined >= 0.95 && joined > sim){ sim = joined; hits = T.map(() => true); }
  }
  return { score:Math.round(Math.max(0, Math.min(1, sim)) * 100), hits, heard };
}

  return heardList.map(h => scorePron(target, h)).reduce((a, b) => (b.score > a.score ? b : a));

const UA = navigator.userAgent;
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IN_APP_BROWSER = /\bLine\/|Instagram|FBAN|FBAV|MicroMessenger/i.test(UA);

function startPron(entries, title, back, tone, force){
  if(entries.length === 0) return;
  if(!SpeechRec || (IOS_NOT_SAFARI && !force) || (IN_APP_BROWSER && !force)){
    const browser = /CriOS/.test(UA) ? "Chrome" : /FxiOS/.test(UA) ? "Firefox" : /EdgiOS/.test(UA) ? "Edge" : IN_APP_BROWSER ? "アプリの中の画面" : "このブラウザ";
    const { close, $ } = openSheet(`${sheetHead("発音チェック")}
      ${IOS_NOT_SAFARI
        ? `<p style="margin:0 0 8px;">iPhone の${esc(browser)}では、iPhone の仕様でマイクの聞き取りが使えません。<b>Safari で開いてください。</b></p>
           <p class="sub" style="font-size:14px; margin-bottom:4px;">下のボタンでこのページのアドレスをコピーして、Safari のアドレス欄に貼り付けて開いてください。マイク以外の機能は、このままでも使えます。</p>
           <button class="btn btn-indiv" id="btnCopyUrl">アドレスをコピーする</button>`
        : IN_APP_BROWSER
        ? `<p style="margin:0 0 8px;">LINE などのアプリの中で開いた画面では、マイクがうまく使えないことがあります。</p>
           <p class="sub" style="font-size:14px;">画面の右上か右下のメニューから「<b>ブラウザで開く</b>」を選んで開き直してください。</p>`
        : `<p style="margin:0 0 8px;">このブラウザは音声の聞き取りに対応していません。</p>
           <p class="sub" style="font-size:14px;">iPhone は <b>Safari</b>、パソコンや Android は <b>Google Chrome</b> で開くと使えます。</p>`}
      ${SpeechRec ? `<button class="btn secondary" id="btnPronAnyway">このまま試す</button>` : ""}
      <button class="btn ghost" data-close>閉じる</button>`);
    const copy = $("#btnCopyUrl");
    if(copy) copy.onclick = async () => {
      const url = location.href.split("#")[0];
      try{ await navigator.clipboard.writeText(url); toast("コピーしました。Safari に貼り付けてください"); }
      catch(e){ window.prompt("このアドレスをコピーして、Safari で開いてください", url); }
    };
    const anyway = $("#btnPronAnyway");
    if(anyway) anyway.onclick = () => { close(); startPron(entries, title, back, tone, true); };
    return;

function finishPron(){

  const passed = tried.filter(w => pron.scores[w.id] >= PRON_PASS);
  const notYet = pron.queue.filter(w => !(pron.scores[w.id] >= PRON_PASS));
  const avg = tried.length ? Math.round(tried.reduce((t, w) => t + pron.scores[w.id], 0) / tried.length) : 0;
  app.innerHTML = `
    <div class="progress-row">
      <button class="icon-btn" id="btnPronPause" aria-label="一覧に戻る" style="margin-left:-8px;">${ICON.left(22)}</button>

    <div class="flash-end flash-in-right">
      <div class="flash-end-mark" style="background:var(--blue-light); color:var(--blue);">${ICON.mic(30)}</div>
      ${tried.length
        ? `<h1>正答率 ${Math.round(100 * passed.length / tried.length)}%</h1>
           <p class="sub">${tried.length}語中 ${passed.length}語が${PRON_PASS}点以上（平均 ${avg}点）</p>`
        : `<h1>おつかれさまでした</h1><p class="sub">マイクをタップして話すと、点数が出ます</p>`}
    </div>
    ${notYet.length > 0 && notYet.length < pron.queue.length
      ? `<button class="btn btn-mic" id="btnPronRetry">${PRON_PASS}点未満の${notYet.length}語をもう一度</button>
         <button class="btn secondary" id="btnPronAll">すべてもう一度</button>`
      : `<button class="btn btn-mic" id="btnPronAll">もう一度最初から</button>`}
    <button class="btn ghost" id="btnPronFinish">一覧に戻る</button>
  `;
  const restart = queue => { pron.queue = queue; pron.idx = 0; pron.scores = {}; pron.results = {}; pron.spokenIdx = null; render(); };
  document.getElementById("btnPronAll").onclick = () => restart(shuffle(pron.queue.slice()));
  const retry = document.getElementById("btnPronRetry");
  if(retry) retry.onclick = () => restart(notYet);
  document.getElementById("btnPronPause").onclick = finishPron;
  document.getElementById("btnPronFinish").onclick = finishPron;
}

/* ===================== バックアップ =====================
   データはこのブラウザにしか無いので、テキスト(JSON)で書き出して、メモやLINEで自分に送っておいてもらう。 */
function backupPayload(){
  return {
    app: "babyShopEnglish", version: 1, exportedAt: new Date().toISOString(),
    customWords: state.customWords, favorites: state.favorites, learned: state.learned, pron: state.pron, altMain: state.altMain
  };
}
function showExportSheet(){
  const json = JSON.stringify(backupPayload());
  const { $ } = openSheet(`
    ${sheetHead("バックアップを書き出す")}
    <p class="sub" style="font-size:14px; margin-bottom:10px;">下のテキストをコピーして、メモアプリや自分宛てのメッセージに保存してください。自作 ${state.customWords.length}語・お気に入り ${state.favorites.length}件・覚えた ${state.learned.length}件 が入っています。</p>
    <textarea class="text-input" id="exportText" rows="5" readonly style="font-size:12px; font-family:ui-monospace, Menlo, monospace;"></textarea>
    <button class="btn btn-indiv" id="btnCopy">コピーする</button>
    <button class="btn ghost" id="btnDownload">ファイルで保存する</button>
  `);
  const ta = $("#exportText");
  ta.value = json;
  $("#btnCopy").onclick = async () => {
    try{ await navigator.clipboard.writeText(json); toast("コピーしました"); }
    catch(e){ ta.focus(); ta.select(); toast("テキストを選択しました。コピーしてください"); }
  };
  $("#btnDownload").onclick = () => {
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type:"application/json" }));
    a.download = `ベビー接客えいご_バックアップ_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
}
function showImportSheet(){
  const { close, $ } = openSheet(`
    ${sheetHead("バックアップから復元")}
    <p class="sub" style="font-size:14px; margin-bottom:10px;">書き出したテキストを貼り付けるか、保存したファイルを選んでください。今のマイ単語帳と「覚えた」は上書きされます。</p>
    <textarea class="text-input" id="importText" rows="5" placeholder="バックアップのテキストを貼り付け" style="font-size:12px; font-family:ui-monospace, Menlo, monospace;"></textarea>
    <label class="btn ghost" style="display:block; cursor:pointer;">ファイルを選ぶ<input type="file" id="importFile" accept=".json,.txt,application/json,text/plain" hidden></label>
    <button class="btn btn-indiv" id="btnDoImport">復元する</button>
  `);
  $("#importFile").onchange = async e => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    if(f.size > 2 * 1024 * 1024){ toast("ファイルが大きすぎます"); return; }
    $("#importText").value = await f.text();
  };
  $("#btnDoImport").onclick = () => {
    const raw = $("#importText").value.trim();
    if(!raw){ toast("テキストを貼り付けてください"); return; }
    let p;
    try{ p = JSON.parse(raw); }catch(e){ p = null; }
    if(!p || typeof p !== "object" || !Array.isArray(p.customWords) || !Array.isArray(p.favorites)){
      window.alert("読み込めませんでした。テキストが途中で切れていないか確認してください。");
      return;
    }
    // 手で書き換えたり壊れたりしたバックアップでも安全に取り込めるよう、型を確かめてから入れる
    const words = sanitizeCustomWords(p.customWords);
    const favs = [...new Set(p.favorites.filter(id => typeof id === "string" && BUILTIN_MAP.has(id)))];
    const knownIds = new Set([...BUILTIN_MAP.keys(), ...words.map(w => w.id)]);
    const learned = Array.isArray(p.learned) ? [...new Set(p.learned.filter(id => typeof id === "string" && knownIds.has(id)))] : [];
    const dropped = p.customWords.length - words.length;
    if(!window.confirm(`自作 ${words.length}語・お気に入り ${favs.length}件 を復元します。今のマイ単語帳は上書きされます。よろしいですか？${dropped > 0 ? `\n（形式が正しくない ${dropped}語は読み込めませんでした）` : ""}`)) return;
    state.customWords = words;
    state.favorites = favs;
    state.learned = learned;
    if(p.altMain && typeof p.altMain === "object" && !Array.isArray(p.altMain)){
      state.altMain = Object.fromEntries(Object.entries(p.altMain).filter(([id, i]) => Number.isInteger(i) && BUILTIN_MAP.has(id) && BUILTIN_MAP.get(id).alts[i]));
    }
    if(p.pron && typeof p.pron === "object" && !Array.isArray(p.pron)){
      state.pron = Object.fromEntries(Object.entries(p.pron).filter(([id, v]) => knownIds.has(id) && v && [v.n, v.ok, v.best].every(x => Number.isFinite(x))));
    }
    // 採番はバックアップの値を信用せず、実際のidから計算し直してidの重なりを防ぐ
    state.nextCustomId = nextIdAfter(words);
    saveState();
    close();
    document.querySelectorAll(".sheet-overlay").forEach(o => o._close());
    toast("復元しました");
    render();
  };
}

/* ===================== 使い方の説明 =====================
   実際の画面の写真(tutorial/*.jpg)に、押すところの印を重ねて見せる。初めて開いたときに自動で出し、ホームの「？」と設定からも見られる。
   画面を変えたら tools/make-shots.sh で写真を撮り直す。部品の位置(tutorial/marks.json)も同じ Chrome で同時に測り直される。
   どの部品を指すかは tools/shot.html の marks(その順番が番号になる)。矢印の出し方は各ページの points で決める:
   side は番号を写真の左("l")・右("r")のどちらに置くか、ax・ay は部品の中のどこを指すか(0〜1。省略すると真ん中)。 */
const TUTORIAL = [
  { img:"home", title:"ようこそ！",
    text:`<p>ベビーカー売り場でよく使う英単語とフレーズが、<br>4つのカテゴリに入っています。<br>まずは気になるカテゴリを開いてみましょう。</p>`,
    points:[{ side:"r", ax:0.8, ay:0.11 }] },
  { img:"cat", title:"単語の一覧",
    text:`<ol><li><b>1</b>青いボタンで、お手本の発音を聞けます</li><li><b>2</b>♡を押すと、マイ単語帳に入ります</li><li><b>3</b>単語をタップすると、例文が開きます</li></ol>`,
    points:[{ side:"r" }, { side:"r" }, { side:"l", ax:0.12 }] },
  { img:"flash", title:"カードで覚える",
    text:`<p>一覧の下の「カードで覚える」から始めます。<br>カードをタップすると裏返り、<br>左右にスワイプすると次のカードへ進みます。</p>`,
    points:[{ side:"l", ax:0.04, ay:0.5 }] },
  { img:"pron", title:"発音チェック",
    text:`<ol><li><b>1</b>マイクをタップ →「録音中」と出たら英語で話し、終わったら ■ をタップ</li><li><b>2</b>通じるかを0〜100点で採点。言えていない単語には赤い波線が付きます</li></ol>`,
    points:[{ side:"r", ax:0.9 }, { side:"l", ax:0.08, ay:0.3 }] },
  { img:"add", title:"マイ単語帳に追加",
    text:`<ol><li><b>1</b>お客さまに言われた言葉やお店の言葉は、日本語を入れるだけ</li><li><b>2</b>英語の候補が出るので、選んで「追加する」を押せばOK</li></ol>`,
    points:[{ side:"l", ax:0.06 }, { side:"l", ax:0.06, ay:0.4 }] },
  { art:"home", title:"ホーム画面に追加しよう",
    text:`<p>iPhone は Safari の共有ボタンから<br>「ホーム画面に追加」を選ぶと、<br>アプリのようにすぐ開けます。</p>` }
];
let tutorialData = { version:"", marks:{} };
async function showTutorial(){
  if(document.querySelector(".tut-overlay")) return;
  try{
    const res = await fetch("tutorial/marks.json", { cache:"no-cache" });
    if(res.ok) tutorialData = await res.json();
  }catch(e){} // 取れなくても、矢印なしで説明は出す
  if(document.querySelector(".tut-overlay")) return;
  stopSpeech();
  let i = 0;
  const ov = document.createElement("div");
  ov.className = "tut-overlay";
  ov.setAttribute("role", "dialog");
  ov.setAttribute("aria-modal", "true");
  ov.setAttribute("aria-label", "使い方");
  document.body.appendChild(ov);
  document.body.classList.add("sheet-open");
  const close = () => {
    window.removeEventListener("resize", onResize);
    ov.remove();
    if(!document.querySelector(".sheet-overlay")) document.body.classList.remove("sheet-open");
    if(!state.tutorialSeen){ state.tutorialSeen = true; saveState(); }
  };
  ov._close = close;
  const draw = () => {
    const t = TUTORIAL[i];
    const last = i === TUTORIAL.length - 1;
    const stage = t.img
      ? `<div class="tut-phone"><img src="tutorial/${t.img}.jpg?v=${encodeURIComponent(tutorialData.version || "")}" alt="${esc(t.title)}の画面"></div>
         <svg class="tut-arrows" aria-hidden="true"></svg>`
      : `<div class="tut-art" style="height:100%;">
          <div class="tut-art-icon"><img src="icons/icon-192.png" alt="" width="96" height="96" style="display:block;"></div>
          <div class="tut-art-steps"><span>${ICON.share(18)}共有</span>→<span>ホーム画面に追加</span></div>
        </div>`;
    ov.innerHTML = `<div class="tut-inner">
      <div class="tut-top"><span class="tut-step">使い方 ${i + 1} / ${TUTORIAL.length}</span>${last ? "<span></span>" : `<button class="tut-skip" id="tutSkip">スキップ</button>`}</div>
      <div class="tut-stage">${stage}</div>
      <h1 class="tut-title">${t.title}</h1>
      <div class="tut-text">${t.text}</div>
      <div class="tut-dots" aria-hidden="true">${TUTORIAL.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
      <div class="tut-nav">
        ${i > 0 ? `<button class="btn secondary" id="tutPrev">戻る</button>` : ""}
        <button class="btn" id="tutNext">${last ? "はじめる" : "次へ"}</button>
      </div>
    </div>`;
    const skip = ov.querySelector("#tutSkip");
    if(skip) skip.onclick = close;
    const prev = ov.querySelector("#tutPrev");
    if(prev) prev.onclick = () => { i--; draw(); };
    ov.querySelector("#tutNext").onclick = () => { if(last) close(); else { i++; draw(); } };
    layout();
    // 次の写真を先に読み込んでおく
    const next = TUTORIAL[i + 1];
    if(next && next.img) new Image().src = `tutorial/${next.img}.jpg?v=${encodeURIComponent(tutorialData.version || "")}`;
  };
  // 写真の大きさを決め、写真の外に番号、そこから指す場所へ矢印を引く
  const layout = () => {
    const t = TUTORIAL[i];
    const stage = ov.querySelector(".tut-stage");
    const phone = ov.querySelector(".tut-phone");
    const svg = ov.querySelector(".tut-arrows");
    if(!phone || !stage) return;
    const W = stage.clientWidth, H = stage.clientHeight;
    const h = Math.max(160, Math.min(H, 470, (W - 2 * 56) * 812 / 375));
    const w = h * 375 / 812;
    const left = (W - w) / 2, top = (H - h) / 2;
    Object.assign(phone.style, { left:left + "px", top:top + "px", width:w + "px", height:h + "px" });
    stage.querySelectorAll(".tut-badge").forEach(b => b.remove());
    const marks = (tutorialData.marks[t.img] || []);
    const pts = (t.points || []).map((p, k) => {
      const m = marks[k];
      if(!m) return null;
      const ax = p.ax ?? 0.5, ay = p.ay ?? 0.5;
      const tx = left + (m[0] + m[2] * ax) / 100 * w;
      const ty = top + (m[1] + m[3] * ay) / 100 * h;
      const bx = p.side === "r" ? Math.min(W - 16, left + w + 30) : Math.max(16, left - 30);
      return { k, tx, ty, bx, by:ty, side:p.side };
    }).filter(Boolean);
    // 同じ側の番号どうしが重ならないよう、縦に少しずらす
    ["l", "r"].forEach(side => {
      const list = pts.filter(p => (p.side === "r") === (side === "r")).sort((a, b) => a.by - b.by);
      for(let k = 1; k < list.length; k++) if(list[k].by - list[k - 1].by < 34) list[k].by = list[k - 1].by + 34;
    });
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    svg.innerHTML = `<defs><marker id="tutHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF8A1F"/></marker></defs>` +
      pts.map(p => {
        const dir = p.tx > p.bx ? 1 : -1;
        const sx = p.bx + dir * 15, sy = p.by;
        const len = Math.hypot(p.tx - sx, p.ty - sy) || 1;
        const ex = p.tx - (p.tx - sx) / len * 9, ey = p.ty - (p.ty - sy) / len * 9; // 指す場所の丸の手前で止める
        return `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" marker-end="url(#tutHead)"/>
          <circle class="tut-target" cx="${p.tx}" cy="${p.ty}" r="7"/>`;
      }).join("");
    pts.forEach(p => {
      const b = document.createElement("span");
      b.className = "tut-badge";
      b.style.left = p.bx + "px";
      b.style.top = p.by + "px";
      b.textContent = pts.length > 1 ? String(p.k + 1) : "";
      stage.appendChild(b);
    });
  };
  const onResize = () => layout();
  window.addEventListener("resize", onResize);
  // 左右のスワイプでも進む・戻る
  let sx = null, sy = null;
  ov.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
  ov.addEventListener("touchend", e => {
    if(sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if(Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
    if(dx < 0 && i < TUTORIAL.length - 1){ i++; draw(); }
    else if(dx > 0 && i > 0){ i--; draw(); }
  });
  draw();
}

/* ===================== キーボード(パソコンで使うとき) ===================== */
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    const overlays = document.querySelectorAll(".sheet-overlay, .tut-overlay");
    if(overlays.length){ overlays[overlays.length - 1]._close(); return; }
    closePopMenu();
    return;
  }
  if(!flashControls || document.querySelector(".sheet-overlay, .tut-overlay")) return;
  if(e.target.closest && e.target.closest("input, textarea")) return;
  if(e.key === "ArrowRight"){ e.preventDefault(); flashControls.next(); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); flashControls.prev(); }
  else if(e.key === " "){ e.preventDefault(); flashControls.flip(); }
});

render();
if(!state.tutorialSeen) showTutorial();
</script>
